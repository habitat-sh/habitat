[package]
name = "habitat-launcher-client"
version = "0.0.0"
edition = "2024"
authors = ["The Habitat Maintainers <humans@habitat.sh>"]
workspace = "../../"

[dependencies]
# Please keep these alphabetized
env_logger = "*"
habitat_common = { path = "../common" }
habitat_core = { path = "../core" }
habitat-launcher-protocol = { path = "../launcher-protocol" }
# Pinned: ipc-channel's wire format changes between minor versions, which breaks
# communication between a Supervisor and Launcher built with different versions.
# Only bump together with a coordinated Launcher release.
ipc-channel = { version = "=0.21.0" }
libc = "*"
log = "0.4"
prost = "*"
serde = "*"
thiserror = "*"
wincode = "*"
