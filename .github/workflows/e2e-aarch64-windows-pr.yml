# Temporary PR coverage while e2e-aarch64-windows.yml is being validated.
# Remove this workflow once Buildkite can dispatch the merged workflow.
name: End-to-end aarch64-windows (PR)
run-name: "Habitat e2e PR #${{ github.event.number }}"

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: aarch64-windows-e2e-pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.test }}
    runs-on: windows-11-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test:
          - test_studio_version
          - test_studio_profile
          - test_studio_can_build_packages
          - test_studio_can_build_packages_with_pkg_version_function
          - test_studio_can_build_scaffolded_package
          - test_studio_with_ssl_cert_file_envvar_set
          - test_ssl_certificate_loading
          - test_pkg_install
          - test_pkg_uninstall_hook
          - test_hab_plan_cli
    env:
      TEST_NAME: ${{ matrix.test }}
      BUILD_PKG_TARGET: aarch64-windows
      HAB_LICENSE: accept-no-persist
      HAB_ORIGIN: habitat-testing
      HAB_BLDR_URL: https://bldr.habitat.sh
      HAB_BLDR_CHANNEL: dev
      HAB_INTERNAL_BLDR_CHANNEL: dev
      HAB_STUDIO_SUP: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare PR checkout on the system drive
        shell: powershell
        run: |
          # Use the PR merge commit checked out by actions/checkout. The tests
          # use /hab paths, which must resolve on the system drive.
          git worktree add --detach C:\habitat-e2e HEAD
          if ($LASTEXITCODE -ne 0) {
              throw "Could not prepare the PR checkout"
          }

      - name: Run end-to-end test against dev packages
        shell: powershell
        working-directory: C:\habitat-e2e
        env:
          HAB_AUTH_TOKEN: ${{ secrets.HAB_AUTH_TOKEN }}
        run: |
          Start-Transcript -Path e2e.log
          try {
              .expeditor/scripts/end_to_end/run_e2e_test.ps1 dev $env:TEST_NAME
          } finally {
              Stop-Transcript
          }

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-aarch64-windows-${{ matrix.test }}
          path: C:/habitat-e2e/*.log
          if-no-files-found: warn
          retention-days: 7
